name: Release frontend
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: frontend-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run check
      - run: npm run package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish immutable frontend version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/frontend.tar.gz release/frontend.tar.gz.sha256 --verify-tag --generate-notes
